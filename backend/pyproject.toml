[project]
name = "mandate-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.2",
    "langchain-anthropic>=0.3",
    "pydantic>=2.8",
    "websockets>=13",
    "structlog>=24",
    "reportlab>=4",
    "httpx>=0.27",
    "prismtrace-sdk>=0.4.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "playwright>=1.62.0",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mandate", "explain"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
